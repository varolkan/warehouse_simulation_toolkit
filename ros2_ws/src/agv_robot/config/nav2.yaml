# Nav2 for the AGV (ROS 2 Jazzy, Nav2 1.3).
#
# The chain a velocity command takes:
#   controller_server / behavior_server -> /cmd_vel_nav -> velocity_smoother
#     -> /cmd_vel_smoothed -> safety_node (LiDAR fields, e-stop, watchdogs) -> /cmd_vel
# Nothing in this file talks to the drive directly.
#
# The vehicle outline (0.60 x 0.44 m, centre-drive) appears here as `footprint`; a test
# keeps it in step with the URDF and the safety fields.

amcl:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    # Odometry noise the filter assumes. Wheel odometry on a level floor is good; these
    # still leave the particles room to follow a slipping wheel.
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.05
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0
    laser_min_range: 0.1
    laser_max_range: 12.0
    max_beams: 180
    z_hit: 0.8
    z_rand: 0.2
    z_short: 0.05
    z_max: 0.05
    sigma_hit: 0.1
    lambda_short: 0.1
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    min_particles: 500
    max_particles: 3000
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    update_min_d: 0.1
    update_min_a: 0.1
    save_pose_rate: 0.5
    tf_broadcast: true
    transform_tolerance: 0.5

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    # How long a tree node waits for a server's answer. Nav2's default of 20 ms is shorter
    # than a costmap clear takes while the costmap is updating: the recoveries' clears were
    # reported as failed, and the global costmap was never cleared after a local one.
    default_server_timeout: 200
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # default_nav_to_pose_bt_xml is set by navigation.launch.py to
    # agv_robot/behavior_trees/navigate_to_pose.xml.
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    use_realtime_priority: false
    enable_stamped_cmd_vel: false
    speed_limit_topic: speed_limit
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    # Standing still for 15 s is "stuck": long enough for a protective stop to clear by
    # itself, short enough that a blocked aisle gets replanned around.
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 15.0
    # Nav2 delivers the vehicle to within 10 cm and 6 degrees of where it was sent. The
    # last centimetres into a station are driven by the mission's own docking controller
    # (agv_core/docking.py), so this does not need to be tight, and a tight tolerance on a
    # pure-pursuit follower only makes it hunt.
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.10
      stateful: true

    # Regulated pure pursuit behind a rotation shim: turn on the spot to face a new path,
    # follow it, slowing for curvature, for nearby obstacles and into the goal, then turn
    # on the spot to the goal heading. The shim does both turns: left to the follower, the
    # final turn and the shim's turn towards each replanned path fight each other.
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      angular_dist_threshold: 0.6
      angular_disengage_threshold: 0.3
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 1.0
      # Below what the velocity smoother allows (2.5), so the turn the controller plans
      # to stop in is one the drive can actually stop in.
      max_angular_accel: 1.5
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: true

      desired_linear_vel: 0.8
      lookahead_dist: 0.6
      min_lookahead_dist: 0.4
      max_lookahead_dist: 1.0
      lookahead_time: 1.2
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.8
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      cost_scaling_dist: 0.5
      cost_scaling_gain: 0.8
      # Must equal the local costmap's inflation cost_scaling_factor.
      inflation_cost_scaling_factor: 4.0
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.6
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.6
      allow_reversing: false
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      footprint: "[[0.30, 0.22], [0.30, -0.22], [-0.30, -0.22], [-0.30, 0.22]]"
      footprint_padding: 0.01
      plugins: ["obstacle_layer", "inflation_layer"]
      filters: ["keepout_filter", "speed_filter"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          # A beam with no return still clears the cells it crossed: two sides of the
          # hall are open, and an obstacle that leaves must not stay in the map.
          inf_is_valid: true
          obstacle_max_range: 4.5
          obstacle_min_range: 0.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.6
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: /keepout_filter_info
      speed_filter:
        plugin: "nav2_costmap_2d::SpeedFilter"
        enabled: true
        filter_info_topic: /speed_filter_info
        speed_limit_topic: /speed_limit
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      footprint: "[[0.30, 0.22], [0.30, -0.22], [-0.30, -0.22], [-0.30, 0.22]]"
      footprint_padding: 0.01
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      filters: ["keepout_filter"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          inf_is_valid: true
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
          raytrace_max_range: 7.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.6
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        # The zones with an expensive band round them as wide as the turning radius: the
        # planner plans for the centre and filters are never inflated (agv_core/masks.py).
        filter_info_topic: /keepout_planner_filter_info
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    costmap_update_timeout: 1.0
    planner_plugins: ["GridBased"]
    # Cost-aware A* on the 5 cm grid: prefers the middle of an aisle to its edge, and
    # treats keep-out zones and unknown space as walls. It plans for the vehicle's centre
    # (cells at or above the inscribed cost are walls); the controller and the safety gate
    # look after the corners. Some builds print "Inflation layer either not found..." at
    # start-up: that look-up is for footprint checks the 2D planner does not make.
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.15
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.5
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.3
    rotational_acc_lim: 2.5
    enable_stamped_cmd_vel: false

# Comfortable accelerations for normal driving. The drive itself can brake harder
# (agv.gazebo.xacro), which is what a protective stop uses.
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [1.0, 0.0, 1.5]
    min_velocity: [-0.3, 0.0, -1.5]
    max_accel: [0.8, 0.0, 2.5]
    max_decel: [-1.2, 0.0, -3.0]
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5
    enable_stamped_cmd_vel: false

# Keep-out and speed-limit zones: masks generated from the site file by
# agv_robot/scripts/generate_masks.py, served here for the costmap filters above.
keepout_mask_server:
  ros__parameters:
    topic_name: /keepout_mask
    frame_id: map
keepout_filter_info_server:
  ros__parameters:
    type: 0
    filter_info_topic: /keepout_filter_info
    mask_topic: /keepout_mask
    base: 0.0
    multiplier: 1.0
keepout_planner_mask_server:
  ros__parameters:
    topic_name: /keepout_planner_mask
    frame_id: map
keepout_planner_filter_info_server:
  ros__parameters:
    type: 0
    filter_info_topic: /keepout_planner_filter_info
    mask_topic: /keepout_planner_mask
    base: 0.0
    multiplier: 1.0
speed_mask_server:
  ros__parameters:
    topic_name: /speed_mask
    frame_id: map
# type 2: the mask holds absolute limits. A cell of value v limits the vehicle to
# v x 0.01 m/s; 0 means no limit.
speed_filter_info_server:
  ros__parameters:
    type: 2
    filter_info_topic: /speed_filter_info
    mask_topic: /speed_mask
    base: 0.0
    multiplier: 0.01
